        a{color:inherit;text-decoration:none}

        .brand-title{font-weight:700;font-size:15px;line-height:1.1}

        .nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
        .nav-toggle{display:none;width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--card-2);flex-direction:column;justify-content:center;align-items:center;gap:4px;cursor:pointer}
        .nav-toggle span{width:16px;height:2px;background:var(--text);border-radius:2px;display:block}
        .theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);cursor:pointer;font-size:12px;font-weight:600}
        .lang{position:relative}

        .lang-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
        .lang.open .lang-menu{display:block}

        .breadcrumbs a:hover{color:var(--text);text-decoration:underline}
        .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        .backtest-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
        .backtest-header .title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px}
        .backtest-header .sub{color:var(--muted);font-size:13px;font-weight:400}
        .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary);border:1px solid transparent}

        .backtest-app{--bbg:var(--bg);--bpanel:var(--card);--bpanel-2:var(--card-2);--bink:var(--text);--bmuted:var(--muted);--bline:var(--border);--bgain:var(--gain);--bloss:var(--loss);--baccent:var(--primary);--bbench:var(--bench)}
        .app{display:grid;grid-template-columns:356px minmax(0,1fr);align-items:start}
        .side{position:sticky;top:58px;max-height:calc(100vh - 58px);overflow:auto;background:var(--card);border-right:1px solid var(--border);scrollbar-width:thin}
